default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('RAILS_MAX_THREADS') { 5 } %>
  host: <%= ENV.fetch('RUNOWN_DATABASE_HOST', 'localhost') %>
  username: <%= ENV.fetch('RUNOWN_DATABASE_USERNAME', 'postgres') %>
  password: <%= ENV.fetch('RUNOWN_DATABASE_PASSWORD', 'password') %>

development:
  <<: *default
  database: runown_development

test:
  <<: *default
  database: runown_test

# Production expects a full DATABASE_URL (Render, Docker, etc. all set this
# for you) so it isn't tied to any one host/username/password.
production:
  url: <%= ENV['DATABASE_URL'] %>
